<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLL Tabulation</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main class="container">
    <a class="back-link" href="index.html">Back to workflow list</a>
    <h1>CLL Tabulation Data Prep</h1>
    <p class="subtitle">Upload CLL tabulation files and create course-wise sheets immediately for review and download.</p>

    <section class="controls">
      <label for="fileInput" class="button">Choose CLL File(s)</label>
      <input id="fileInput" type="file" accept=".xlsx,.xls" multiple />

      <label for="sheetSelect">Course Sheet:</label>
      <select id="sheetSelect" disabled></select>

      <button id="downloadBtn" type="button" disabled>Download CLL Data</button>
      <button id="clearBtn" type="button" disabled>Clear All Data</button>
    </section>

    <p id="status" class="status">No file loaded.</p>
    <section id="summary" class="summary-panel"></section>

    <section class="table-wrap">
      <table id="resultTable"></table>
    </section>
  </main>

  <script src="cll-tabulation.js"></script>
</body>
</html>
