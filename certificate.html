<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Creation</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main class="container">
    <a class="back-link" href="index.html">Back to workflow list</a>
    <h1>Certificate Creation Data Prep</h1>
    <p class="subtitle">Upload multiple Excel files and extract only Name, Enrollment No, Grade, and Course Name for certificate generation.</p>

    <section class="controls">
      <label for="fileInput" class="button">Choose Excel File(s)</label>
      <input id="fileInput" type="file" accept=".xlsx,.xls" multiple />

      <button id="downloadBtn" type="button" disabled>Download Certificate Data</button>
      <button id="clearBtn" type="button" disabled>Clear All Data</button>
    </section>

    <p id="status" class="status">No file loaded.</p>
    <section id="summary" class="summary-panel"></section>

    <section class="table-wrap">
      <table id="resultTable"></table>
    </section>
  </main>

  <script src="certificate.js"></script>
</body>
</html>
